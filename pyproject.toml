[project]
name = "n-i-x"
version = "0.1.0"
description = "dependencies required for this project."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1",
    "fastapi-csrf-protect>=1.0.6",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "nanoid>=2.0.0",
    "passlib>=1.7.4",
    "pillow>=11.3.0",
    "pydantic>=2.11.7",
    "pyjwt>=2.10.1",
    "pyotp>=2.9.0",
    "python-multipart>=0.0.20",
    "qrcode>=8.2",
    "slowapi>=0.1.9",
    "sqlmodel>=0.0.24",
    "starlette-session>=0.4.3",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "fastapi[standard]>=0.116.1",
]
