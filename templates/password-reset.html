<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />

        <link href="data:image/x-icon;base64," rel="icon" type="image/x-icon" />
        <link crossorigin="" href="https://fonts.gstatic.com/" rel="preconnect" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <link as="style" href="https://fonts.googleapis.com/css2?display=swap&amp;family=Noto+Sans%3Awght%40400%3B500%3B700%3B900&amp;family=Space+Grotesk%3Awght%40400%3B500%3B700" onload="this.rel='stylesheet'" rel="stylesheet" />

        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        <link href="{{ url_for('static', path='css/password-reset.css') }}" rel="stylesheet" type="text/tailwindcss"/>
        <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon.ico') }}">

        <title>N.I.X-Password Reset</title>
    </head>
    <body class="bg-[#101E1E] text-white" style="font-family: &quot;Space Grotesk&quot;, &quot;Noto Sans&quot;, sans-serif;">
        <div class="relative flex size-full min-h-screen flex-col dark group/design-root overflow-x-hidden" >
            <div class="layout-container flex h-full grow flex-col">
                <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-b-[#2A3C3C] px-10 py-4" >
                    <div class="flex items-center gap-3 text-white">
                        <svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" >
                            <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                            <path d="M2 7L12 12L22 7" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                            <path d="M12 22V12" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                        </svg>
                        <h2 class="text-xl font-bold leading-tight tracking-[-0.015em] text-[#3df5f5]" >N.I.X</h2>
                    </div>
                    <div class="group relative">
                        <button class="relative flex size-10 items-center justify-center rounded-full border-2 border-transparent transition-all duration-300 hover:border-[#05cdff]" >
                            <div class="absolute inset-0 rounded-full animate-pulse-on-hover" ></div>
                            <svg class="h-6 w-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" >
                                <path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-width="2" ></path>
                            </svg>
                        </button>
                        <div class="tooltip invisible opacity-0 absolute right-0 top-full mt-2 w-48 rounded-md bg-[#182C2C] p-2 shadow-lg ring-1 ring-black ring-opacity-5 transition-opacity duration-300 ease-in-out" >
                            <a class="block px-4 py-2 text-sm text-white transition-all duration-200 hover:scale-105 hover:bg-gray-700/50 rounded-md" href="#" >Account Settings</a >
                            <a class="block px-4 py-2 text-sm text-white transition-all duration-200 hover:scale-105 hover:bg-gray-700/50 rounded-md" href="{{ url_for('dashboard', uid=uid) }}" >Dashboard</a >
                        </div>
                    </div>
                </header>
                <main class="flex flex-1 items-center justify-center px-4 py-10 sm:px-6 lg:px-8" >
                    <div class="w-full max-w-md space-y-8">
                        <div>
                            <h1 class="text-center text-3xl font-bold leading-tight tracking-tight text-[#3df5f5]" >
                                Reset Your Password
                            </h1>
                            <p class="mt-2 text-center text-sm text-gray-400">
                                Enter a new password for your account.
                            </p>
                        </div>
                        <form action="{{ url_for('password_reset', uid=uid) }}" class="mt-8 space-y-6" method="POST" onsubmit="return validatePassword(event)" >
                            <input name="verification_code_hash" type="hidden" value="{{ code_hash }}" />
                            <div class="rounded-md shadow-sm space-y-4">
                                <div class="relative">
                                    <input class="relative block w-full appearance-none rounded-md border border-[#374151] bg-[#1a2c2c] px-3 py-3 text-white placeholder-gray-500 focus:z-10 focus:border-[#3df5f5] focus:outline-none focus:ring-[#3df5f5] sm:text-sm shadow-inner"
                                        id="new-password" name="new_pswd" placeholder="New Password" required="" type="password" />
                                    <button class="absolute inset-y-0 right-0 flex items-center pr-3" onclick="togglePasswordVisibility('new-password', this)" type="button" >
                                        <span class="material-symbols-outlined h-5 w-5 text-gray-400" >visibility</span>
                                    </button>
                                </div>
                                <div class="relative">
                                    <input class="relative block w-full appearance-none rounded-md border border-[#374151] bg-[#1a2c2c] px-3 py-3 text-white placeholder-gray-500 focus:z-10 focus:border-[#3df5f5] focus:outline-none focus:ring-[#3df5f5] sm:text-sm shadow-inner"
                                        id="confirm-new-password" name="cnfm_pswd" placeholder="Confirm New Password" required="" type="password" />
                                    <button class="absolute inset-y-0 right-0 flex items-center pr-3" onclick="togglePasswordVisibility('confirm-new-password', this)" type="button" >
                                        <span class="material-symbols-outlined h-5 w-5 text-gray-400">visibility</span>
                                    </button>
                                </div>
                                <div class="relative">
                                    <input class="relative block w-full appearance-none rounded-md border border-[#374151] bg-[#1a2c2c] px-3 py-3 text-white placeholder-gray-500 focus:z-10 focus:border-[#3df5f5] focus:outline-none focus:ring-[#3df5f5] sm:text-sm shadow-inner"
                                        id="verification-code" name="verification_code" placeholder="Verification Code" required="" type="number" />
                                </div>
                            </div>
                            <span id="error" style="color: #ef4444; font-size: 0.875rem; font-weight: 500; margin-top: 0.5rem; animation: fadeInSlideUp 0.3s ease-out;">{{ error }}</span>
                            <div class="group">
                                <button class="change-password-animation group relative flex w-full justify-center rounded-md border border-transparent bg-[#3df5f5] px-4 py-2 text-sm font-bold text-[#102323] hover:bg-opacity-80 focus:outline-none focus:ring-2 focus:ring-[#3df5f5] focus:ring-offset-2 focus:ring-offset-[#101E1E]"
                                id="change-pswd-btn" type="submit" >
                                    Change Password
                                </button>
                            </div>
                        </form>
                    </div>
                </main>
            </div>
            <div class="fixed inset-0 bg-black bg-opacity-50 z-40" id="success-overlay" style="display: none" ></div>
            <div class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-50 flex flex-col items-center gap-4 rounded-lg bg-[#182C2C] p-6 text-center text-white shadow-2xl opacity-0 transform" id="success-banner" style="display: none" >
                <div class="checkmark-wrapper">
                    <svg class="checkmark" height="56" viewBox="0 0 52 52" width="56" xmlns="http://www.w3.org/2000/svg" >
                        <circle class="checkmark__circle" cx="26" cy="26" fill="none" r="25" ></circle>
                        <path class="checkmark__check" d="M14.1 27.2l7.1 7.2 16.7-16.8" fill="none" stroke="#3df5f5" stroke-width="5" ></path>
                    </svg>
                </div>
                <span class="text-xl font-semibold">Password Reset Successfully!</span>
                <p class="text-sm text-gray-400 max-w-xs">
                    You can now use your new password to log in to your account.
                </p>
                <a class="mt-2 inline-block w-full rounded-md bg-[#3df5f5] px-4 py-2.5 text-sm font-bold text-[#102323] transition-transform duration-200 hover:scale-105 hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-[#3df5f5] focus:ring-offset-2 focus:ring-offset-[#182C2C]"
                    href="{{ url_for('home') }}">
                    Login Here
                </a>
            </div>
        </div>

        <script src="{{ url_for('static', path='js/password-reset.js') }}"></script>
    </body>
</html>
