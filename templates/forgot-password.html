<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta content="width=device-width, initial-scale=1.0" name="viewport" />

        <link href="https://fonts.googleapis.com" rel="preconnect" />
        <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
        <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet" />
        <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
        <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        <link href="{{ url_for('static', path='css/forgot-password.css') }}" rel="stylesheet">
        <link rel="icon" type="image/png" href="{{ url_for('static', path='images/favicon.ico') }}">

        <title>N.I.X-Forgot Password</title>
    </head>
    <body class="bg-[var(--dark-bg)] text-[var(--text-primary)]">
        <div class="flex flex-col min-h-screen">
            <header class="flex items-center justify-between whitespace-nowrap border-b border-solid border-[var(--border-color)] px-10 py-3" >
                <div class="flex items-center gap-3 text-white">
                    <svg fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg" >
                        <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                        <path d="M2 7L12 12L22 7" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                        <path d="M12 22V12" stroke="#3df5f5" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" ></path>
                    </svg>
                    <h2 class="text-xl font-bold leading-tight tracking-[-0.015em] text-[#3df5f5]" > N.I.X </h2>
                </div>
                <a href="{{ url_for('home') }}" class="hidden md:flex min-w-[84px] max-w-[480px] cursor-pointer items-center justify-center overflow-hidden rounded-lg h-10 px-6 bg-[var(--primary-color)] text-[var(--dark-bg)] text-sm font-bold tracking-wide hover:opacity-90 transition-opacity" >
                    <span class="truncate">Sign In</span>
                </a>
                <button class="md:hidden text-white">
                    <span class="material-symbols-outlined">menu</span>
                </button>
            </header>
            <main class="flex flex-1 items-center justify-center py-12 px-4 sm:px-6 lg:px-8" >
                <div class="w-full max-w-md space-y-8" id="form-container">
                    <div>
                        <h2 class="mt-6 text-center text-3xl font-bold tracking-tight text-white" >
                            Forgot Your Password?
                        </h2>
                        <p class="mt-2 text-center text-sm text-[var(--text-secondary)]" >
                            Enter your email to reset your password.
                        </p>
                    </div>
                    <form action="/web/account/security/forgot-password" class="mt-8 space-y-6" id="forgot-password-form" method="POST" >
                        <div class="space-y-4" id="email-section">
                            <div>
                                <label class="sr-only" for="email-address">Email address</label>
                                <input class="relative block w-full appearance-none rounded-md border border-[var(--border-color)] bg-[var(--input-bg)] px-3 py-3 text-white placeholder-[var(--text-secondary)] focus:z-10 focus:border-[var(--primary-color)] focus:outline-none focus:ring-[var(--primary-color)] sm:text-sm"
                                    autocomplete="email" id="email-address" name="email" placeholder="Email address" required="" type="email" />
                            </div>
                            <button class="group relative flex w-full justify-center items-center rounded-md border border-transparent bg-[var(--primary-color)] py-3 px-4 text-sm font-bold text-[var(--dark-bg)] hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-[var(--primary-color)] focus:ring-offset-2 focus:ring-offset-[var(--dark-bg)] transition-all" id="send-code-btn" type="submit" >
                                <span id="send-code-text" >Send Verification Code</span >
                                <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-[var(--dark-bg)] hidden" fill="none" id="spinner" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" >
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" ></circle>
                                    <path class="opacity-75" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z" fill="currentColor" ></path>
                                </svg>
                            </button>
                            <div class="text-center text-sm text-[var(--text-secondary)] mt-2 fade-in" id="success-message" ></div>
                        </div>
                    </form>
                </div>
            </main>
        </div>
        <script>

        </script>
    </body>
</html>
